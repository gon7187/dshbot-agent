<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="DSHBOT — a personal autonomous agent in Telegram on DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#151f4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#22c3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="card">
      <rect width="1280" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="1010" cy="150" r="170" fill="#4d6bfe" opacity="0.35" filter="url(#blur)"/>
    <circle cx="180" cy="300" r="140" fill="#22c3ee" opacity="0.18" filter="url(#blur)"/>
  </g>

  <!-- mark -->
  <rect x="72" y="72" width="88" height="88" rx="22" fill="url(#accent)"/>
  <path d="M123 86 96 124h20l-6 28 28-40h-20z" fill="#ffffff"/>

  <!-- title -->
  <text x="72" y="236" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="2" fill="#ffffff">DSHBOT</text>
  <text x="186" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#dbe3ff">Personal autonomous agent</text>
  <text x="186" y="148" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#dbe3ff">in Telegram</text>
  <text x="74" y="276" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" fill="#8fa2e8">DeepSeek Harness · one Node process · cold start &lt; 1 s · 0 idle model calls</text>

  <!-- chat -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18">
    <rect x="884" y="64" width="324" height="52" rx="18" fill="#2b5278"/>
    <text x="906" y="96" fill="#ffffff">fix the gate and commit</text>

    <rect x="760" y="132" width="448" height="120" rx="18" fill="#182533" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="782" y="164" fill="#ffffff">Done. Sandbox gate: 12/12 green.</text>
    <text x="782" y="194" fill="#9fb3c8">Commit f95a731, server deploy — active.</text>
    <rect x="782" y="210" width="128" height="28" rx="14" fill="#4d6bfe" opacity="0.9"/>
    <text x="846" y="230" fill="#ffffff" font-size="15" text-anchor="middle">Accept</text>
    <rect x="922" y="210" width="128" height="28" rx="14" fill="#ffffff" fill-opacity="0.08"/>
    <text x="986" y="230" fill="#dbe3ff" font-size="15" text-anchor="middle">Roll back</text>
  </g>
</svg>
