name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The private working repository runs its tests locally; Actions minutes go to the public one.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js from package.json engines
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install bubblewrap and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ffmpeg

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The runner's bwrap-userns-restrict profile confines the sandbox in
      # unpriv_bwrap, which forbids the nested sandbox of the container mode.
      - name: Unload AppArmor profiles
        run: sudo aa-teardown

      # A guest test runs find over the visible filesystem with a 60 s limit;
      # the runner image carries about a million files of unused SDKs, and a
      # cold walk of the rest is still slower than that, so warm the cache in
      # the background while dependencies install and the first tests run.
      - name: Remove unused SDKs of the runner image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/jvm
          nohup find / \( -path /proc -o -path /sys -o -path /dev \) -prune -o -print > /dev/null 2>&1 &

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
